[project]
name = "code2map"
version = "0.4.0"
description = "Transform large source code into semantic maps for AI-driven analysis and review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "code2map developers", email = "info@elvez.co.jp" },
]
keywords = [
    "code",
    "map",
    "ast",
    "tree-sitter",
    "code-review",
    "llm",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-java>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.uv]
# Security: raise the floor of the transitive dependency `cryptography`
# (pulled in via twine -> keyring -> SecretStorage on Linux).
#   - < 48.0.1 bundles a vulnerable OpenSSL in its wheels (GHSA-537c-gmf6-5ccf)
#   - < 50.0.0 exposes a Bleichenbacher oracle in PKCS#7 EnvelopedData
#     decryption (GHSA-g6cj-pr64-35w5 / CVE-2026-69247)
constraint-dependencies = ["cryptography>=50.0.0"]

[project.scripts]
code2map = "code2map.cli:main"

[project.urls]
Homepage = "https://github.com/elvezjp/code2map"
Repository = "https://github.com/elvezjp/code2map"
Documentation = "https://github.com/elvezjp/code2map#readme"
Changelog = "https://github.com/elvezjp/code2map/blob/main/CHANGELOG.md"
Issues = "https://github.com/elvezjp/code2map/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code2map"]

[tool.hatch.build.targets.sdist]
include = [
    "/code2map",
    "/tests",
    "/README.md",
    "/README_ja.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CHANGELOG_ja.md",
    "/CONTRIBUTING.md",
    "/CONTRIBUTING_ja.md",
    "/SECURITY.md",
    "/SECURITY_ja.md",
    "/spec.md",
    "/spec_en.md",
    "/docs/context",
    "/examples",
    "/pyproject.toml",
]
exclude = [
    "/main.py",
    "/.github",
    "/.claude",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
# Fragments and parser-error fixtures are intentionally not standalone Python.
extend-exclude = ["docs/examples", "tests/fixtures"]
